name: Runtime Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  runtime-verification:
    name: Runtime Verification Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
          cache: true

      - name: Install goverify
        run: go install github.com/nichoalous/goverity@latest

      - name: Run runtime verification
        run: go test -tags runtime_verification ./...

      - name: Run property-based tests
        run: go test -pbt ./...

      - name: Run invariant checks
        run: go test -invariant ./...

      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-verification-results
          path: |
            verification-report.json
            invariant-violations.log
            property-violations.log
